# Workflow de Release automático
# Dispara quando um tag como v1.0.0 é pushado
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore ./Loader/Loader.csproj
          dotnet restore ./Loader/Plugin/Plugin.csproj

      - name: Build
        run: |
          dotnet build ./Loader/Loader.csproj --configuration Release --no-restore
          dotnet build ./Loader/Plugin/Plugin.csproj --configuration Release --no-restore

      - name: Empacotar plugin
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          $pluginOut = "./Loader/Plugin/bin/Release/net8.0-windows"
          Compress-Archive -Path "$pluginOut/*" -DestinationPath "./artifacts/PluginPackage.zip" -Force

      - name: Atualizar manifesto
        uses: actions/github-script@v7
        with:
          script: |
            const path = "Loader/revit/loader-manifest.json";
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.startsWith("v") ? tag.substring(1) : tag;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const packageUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/PluginPackage.zip`;
            const releaseNotesUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            const manifest = {
              version,
              packageUrl,
              entryAssemblyName: "HelloWorldPlugin.dll",
              entryClassName: "HelloWorldPlugin.App",
              releaseNotesUrl
            };
            const content = Buffer.from(JSON.stringify(manifest, null, 2) + "\n").toString("base64");
            const existing = await github.rest.repos.getContent({ owner, repo, path });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `Update loader manifest for ${tag}`,
              content,
              sha: existing.data.sha
            });

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref }}
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
