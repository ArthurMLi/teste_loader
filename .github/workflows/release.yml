# Workflow de Release automático
# Dispara quando um tag como v1.0.0 é pushado
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore ./Loader/Loader.csproj
          dotnet restore ./Loader/Plugin/Plugin.csproj

      - name: Build
        run: |
          dotnet build ./Loader/Loader.csproj --configuration Release --no-restore
          dotnet build ./Loader/Plugin/Plugin.csproj --configuration Release --no-restore

      - name: Empacotar plugin
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          $pluginOut = "./Loader/Plugin/bin/Release/net8.0-windows"
          Compress-Archive -Path "$pluginOut/*" -DestinationPath "./artifacts/PluginPackage.zip" -Force

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref }}
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
